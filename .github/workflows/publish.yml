name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@11.17.0 --ignore-scripts

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node --print "require('./package.json').version")"

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate package
        run: npm run validate

      - name: Stage package with provenance
        run: npm stage publish --access public --provenance
